<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clock</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100dvh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    .container{
      width:350px;
      padding:30px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px);
      box-shadow:0 8px 30px rgba(0,0,0,0.3);
      text-align:center;
    }

    .header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  margin-bottom:18px;
}

.header-icon{
  width:60px;
  height:60px;
  flex-shrink:0;
  filter:
    drop-shadow(0 0 8px rgba(245,118,173,0.35));
}

.header-text{
  display:flex;
  align-items:center;
}

.now-text{
  font-size:18px;
  font-weight:600;
  color:#ffffff;
  letter-spacing:0.3px;
}

    /* ANALOG CLOCK */

    .analog-clock{
      width:220px;
      height:220px;
      border:18px solid #F576AD;
      border-radius:50%;
      margin:0 auto 30px;
      position:relative;
      background:rgb(241, 236, 236);
    }
/*lopala ring kosam*/
    .analog-clock::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:200px;
  height:200px;
  border:2px solid rgba(151, 147, 147, 0.4);
  border-radius:50%;
}
/*outer ring kosam*/
.analog-clock::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:220px;
  height:220px;
  border:4px solid rgb(241, 236, 236, 0.7);
  border-radius:50%;
  box-shadow:
    0 0 15px rgba(255,255,255,0.2);
}

    .center-dot{
      width:5px;
      height:5px;
      background:rgb(228, 222, 222);
      border-radius:50%;
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:10;
    }
    /* dot ki outer border*/
    .center-dot::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:6px;
  height:6px;
  border-radius:50%;
  border:3px solid #0f172a;;
  box-shadow:
    0 0 10px rgba(246, 86, 211, 0.5);
}

    .hand{
      position:absolute;
      bottom:50%;
      left:50%;
      transform-origin:bottom;
      transform:translateX(-50%);
      border-radius:10px;
    }

    .hour-hand{
      width:6px;
      height:50px;
      background:rgb(80, 78, 78);
    }

    .minute-hand{
      width:4px;
      height:60px;
      background:#38bdf8;
    }

    .second-hand{
      width:2px;
      height:65px;
      background:#f43f5e;
    }

    /* CLOCK NUMBERS */

    .number{
      position:absolute;
      width:100%;
      height:100%;
      text-align:center;
      font-size:20px;
      font-weight:bold;
    }

    .number span{
      display:block;
    }

    .n12{ transform:rotate(0deg); }
    .n1{ transform:rotate(30deg); }
    .n2{ transform:rotate(60deg); }
    .n3{ transform:rotate(90deg); }
    .n4{ transform:rotate(120deg); }
    .n5{ transform:rotate(150deg); }
    .n6{ transform:rotate(180deg); }
    .n7{ transform:rotate(210deg); }
    .n8{ transform:rotate(240deg); }
    .n9{ transform:rotate(270deg); }
    .n10{ transform:rotate(300deg); }
    .n11{ transform:rotate(330deg); }

    .number span{
      transform:rotate(calc(-1 * var(--rotate)));  /*calc() for -ve rotation,var() to access custom property from inline style*/
      display:inline-block;
      margin-top:10px;
    }

    /* DIGITAL CLOCK */

    .digital-clock{
      font-size:40px;
      font-weight:bold;
      letter-spacing:2px;
      margin-bottom:10px;
    }

    /* DATE */

    .date{
      font-size:18px;
      color:#cbd5e1;
      margin-bottom:15px;
    }

    /* DIALOGUE */

.dialogue-container{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:10px;

  margin-top:8px;
}

#dialogue-animation{
  width:44px;
  height:44px;

  flex-shrink:0;
}

.dialogue{
  font-size:22px;
  color:#38bdf8;
  font-weight:600;
}


@media(max-width:480px){

  .container{
    background:transparent;
    backdrop-filter:none;
    box-shadow:none;
    border:none;
  }

  .digital-clock{
    font-size:28px;
  }
}


  </style>
</head>
<body>



  <div class="container">

<div class="header">
<lottie-player
  src="https://lottie.host/cc3c2e44-9686-4696-af3e-ac3bfd8c6aff/1indCmYGkF.json"
  background="transparent"
  speed="1"
  loop
  autoplay
  class="header-icon">
</lottie-player>
  <div class="header-text">
    <p class="now-text">Now, The time is...</p>
  </div>
</div>

    <!-- ANALOG CLOCK -->
    <div class="analog-clock">

      <!-- NUMBERS -->
      <div class="number n12" style="--rotate:0deg"><span style="color: #F576AD;">12</span></div>
      <div class="number n1" style="--rotate:30deg"><span style="color: #0f172a;">1</span></div>
      <div class="number n2" style="--rotate:60deg"><span style="color: #0f172a;">2</span></div>
      <div class="number n3" style="--rotate:90deg"><span style="color: #F576AD;">3</span></div>
      <div class="number n4" style="--rotate:120deg"><span style="color: #0f172a;">4</span></div>
      <div class="number n5" style="--rotate:150deg"><span style="color: #0f172a;">5</span></div>
      <div class="number n6" style="--rotate:180deg"><span style="color: #F576AD;">6</span></div>
      <div class="number n7" style="--rotate:210deg"><span style="color: #0f172a;">7</span></div>
      <div class="number n8" style="--rotate:240deg"><span style="color: #0f172a;">8</span></div>
      <div class="number n9" style="--rotate:270deg"><span style="color: #F576AD;">9</span></div>
      <div class="number n10" style="--rotate:300deg"><span style="color: #0f172a;">10</span></div>
      <div class="number n11" style="--rotate:330deg"><span style="color: #0f172a;">11</span></div>

      <!-- HANDS -->
      <div class="hand hour-hand"></div>
      <div class="hand minute-hand"></div>
      <div class="hand second-hand"></div>

      <!-- CENTER -->
      <div class="center-dot"></div>

    </div>

    <!-- DIGITAL CLOCK -->
    <div class="digital-clock">
      10:45:32 <span id="time-specification">PM</span>
    </div>

    <!-- DATE -->
    <div class="date">
      Wednesday, May 27
    </div>

    <!-- DIALOGUE -->
<div class="dialogue-container">

  <div class="dialogue">
    Good Evening
  </div>

  <lottie-player
    id="dialogue-animation"
    background="transparent"
    speed="1"
    loop
    autoplay>
  </lottie-player>

</div>

  </div>

<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script>
    // SELECT ANALOG HANDS
  const hourHand = document.querySelector(".hour-hand");
  const minuteHand = document.querySelector(".minute-hand");
  const secondHand = document.querySelector(".second-hand");

  // SELECT DIGITAL ELEMENTS
  const digitalClock = document.querySelector(".digital-clock");
  const dateElement = document.querySelector(".date");
  const dialogue = document.querySelector(".dialogue");

const dialogueAnimation = document.querySelector("#dialogue-animation");
let currentAnimation = "";

  function updateClock(){

    // CURRENT TIME
    const now = new Date();

    // TIME VALUES
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();


//analog clock kosam
    // SECOND HAND
    const secondRotation = seconds * 6;
    // MINUTE HAND
    const minuteRotation = (minutes * 6) + (seconds * 0.1);
    // HOUR HAND
    const hourRotation = (hours * 30) + (minutes * 0.5);
    // APPLY ROTATION
    secondHand.style.transform = `translateX(-50%) rotate(${secondRotation}deg)`;
    minuteHand.style.transform = `translateX(-50%) rotate(${minuteRotation}deg)`;
    hourHand.style.transform = `translateX(-50%) rotate(${hourRotation}deg)`;


//digital clock kosam
    // AM / PM
    const ampm = hours >= 12 ? "PM" : "AM";
    // CONVERT TO 12-HOUR FORMAT
    hours = hours % 12;
    if(hours === 0){
      hours = 12;
    }
    // ADD LEADING ZERO
    const formattedHours = String(hours).padStart(2, "0");
    const formattedMinutes = String(minutes).padStart(2, "0");
    const formattedSeconds = String(seconds).padStart(2, "0");

    // DISPLAY DIGITAL TIME
    digitalClock.innerHTML =
      `${formattedHours}:${formattedMinutes}:${formattedSeconds}
       <span id="time-specification">${ampm}</span>`;

       //dates
    const days = [
      "Sunday",
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday"
    ];

    const months = [
      "January",
      "February",
      "March",
      "April",
      "May",
      "June",
      "July",
      "August",
      "September",
      "October",
      "November",
      "December"
    ];

    const dayName =
      days[now.getDay()];

    const monthName =
      months[now.getMonth()];

    const todayDate =
      now.getDate();

    const fullDate = `${dayName}, ${monthName} ${todayDate}`;

    dateElement.innerHTML = fullDate;

    //dialogue
    let message = "";

    const currentHour =  now.getHours();

    if(currentHour >= 5 && currentHour < 12){

      message = "Good Morning";
      const newAnimation = "https://lottie.host/c09907e4-f856-41dc-b2d6-d08fa1447b57/5hauhSQhNc.json";

if(currentAnimation !== newAnimation){

   dialogueAnimation.load(newAnimation);
   currentAnimation = newAnimation;
}

    }

    else if(currentHour >= 12 && currentHour < 17){

      message = "Good Afternoon";
      const newAnimation =
"https://lottie.host/200366ef-f676-412b-a3cb-712f8bc6f000/g46PYQVji5.json";

if(currentAnimation !== newAnimation){

   dialogueAnimation.load(newAnimation);

   currentAnimation = newAnimation;
}

    }

    else if(currentHour >= 17 && currentHour < 21){

      message = "Good Evening";
      const newAnimation =
"https://lottie.host/5a8825da-b62d-4713-8cac-d1f71bcf958a/8oJszLpNFT.json";

if(currentAnimation !== newAnimation){

   dialogueAnimation.load(newAnimation);

   currentAnimation = newAnimation;
}

    }

    else{

      message = "Good Night";
      const newAnimation = "https://lottie.host/bbd7f7ec-0636-4d73-80a9-d672ee6b56a8/WVpRSp1GRr.json";

      if(currentAnimation !== newAnimation){

        dialogueAnimation.load(newAnimation);
        currentAnimation = newAnimation;
      }

    }

    dialogue.innerHTML = message;

  }


  updateClock();
  setInterval(updateClock, 1000);
</script>


</body>
</html>
